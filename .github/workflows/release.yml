name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          # No registry-url: setup-node would write GITHUB_TOKEN into .npmrc,
          # which shadows OIDC trusted publishing and fails with E404.
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@11 --force
      - name: Decide whether this version is new
        id: version
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and build
        if: steps.version.outputs.publish == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild fs-ext --foreground-scripts
          npm run build
      - name: Publish to npm (OIDC trusted publishing, provenance attached)
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
      - name: Tag and create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
